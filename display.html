<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>DSO-1 — Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }
    #display-canvas {
      display: block;
      width: 100%; height: 100%;
    }
    #waiting {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a3a1a;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      pointer-events: none;
    }
    #close-overlay {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 20px;
      line-height: 38px;
      text-align: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
      pointer-events: none;
      font-family: Arial, sans-serif;
    }
    #close-overlay:hover {
      background: rgba(255,60,60,0.6);
    }
    body.show-close #close-overlay {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="display-canvas"></canvas>
  <div id="waiting">WAITING FOR SIGNAL…</div>
  <div id="close-overlay" title="Close display">✕</div>

  <script src="src/display-view.js"></script>
</body>
</html>
