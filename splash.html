<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DSO-1 — Loading</title>
<style>
  :root {
    --p: #00ff41;
    --p-rgb: 0,255,65;
    --bg: #080808;
    --panel: #0d0d0d;
    --border: #252525;
    --text: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;      /* transparent Electron window */
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    user-select: none;
    -webkit-user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }

  .bezel {
    width: 460px;
    height: 300px;
    border-radius: 16px;
    background:
      radial-gradient(120% 120% at 50% 0%, #141414 0%, var(--panel) 45%, #060606 100%);
    border: 1px solid rgba(var(--p-rgb), 0.28);
    box-shadow:
      0 0 0 1px #000 inset,
      0 18px 50px rgba(0,0,0,0.6),
      0 0 60px rgba(var(--p-rgb), 0.08);
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-app-region: drag;     /* lets user move the splash if needed */
  }

  /* ── CRT scope screen ── */
  .screen {
    position: relative;
    flex: 1;
    border-radius: 10px;
    background: radial-gradient(90% 90% at 50% 45%, #0a1a0a 0%, #050a05 100%);
    border: 1px solid #1a1a1a;
    box-shadow: inset 0 0 22px rgba(0,0,0,0.8), inset 0 0 4px rgba(var(--p-rgb),0.12);
    overflow: hidden;
  }
  .screen canvas { display: block; width: 100%; height: 100%; }
  /* scanline overlay */
  .screen::after {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.18) 2px 3px);
    pointer-events: none;
  }

  /* ── Title row ── */
  .title { display: flex; align-items: baseline; gap: 10px; padding: 0 2px; }
  .title .mark {
    font-size: 26px; font-weight: 700; letter-spacing: 4px;
    color: var(--p);
    text-shadow: 0 0 8px rgba(var(--p-rgb), 0.75), 0 0 18px rgba(var(--p-rgb), 0.35);
  }
  .title .sub {
    font-size: 11px; letter-spacing: 3px; color: #6a6a6a; text-transform: uppercase;
  }

  /* ── Status row ── */
  .status { display: flex; align-items: center; gap: 9px; padding: 0 2px; }
  .led {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--p);
    box-shadow: 0 0 8px rgba(var(--p-rgb), 0.9);
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }
  .status .msg {
    font-size: 11px; letter-spacing: 1.5px; color: #9a9a9a; text-transform: uppercase;
  }
  .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%{content:"...";} }

  /* ── Indeterminate progress shimmer ── */
  .bar {
    height: 3px; border-radius: 3px; margin: 0 2px;
    background: #101810; overflow: hidden; position: relative;
  }
  .bar::before {
    content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--p), transparent);
    box-shadow: 0 0 8px rgba(var(--p-rgb), 0.6);
    animation: sweep 1.5s ease-in-out infinite;
  }
  @keyframes sweep { 0%{left:-40%;} 100%{left:100%;} }
</style>
</head>
<body>
  <div class="bezel">
    <div class="screen"><canvas id="scope"></canvas></div>
    <div class="title">
      <span class="mark">DSO-1</span>
      <span class="sub">Oscilloscope</span>
    </div>
    <div class="status">
      <span class="led"></span>
      <span class="msg"><span id="stateText">Initializing</span><span class="dots"></span></span>
    </div>
    <div class="bar"></div>
  </div>

<script>
  // ── Animated phosphor sine sweep ──────────────────────────────────
  const cvs = document.getElementById('scope');
  const ctx = cvs.getContext('2d');
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const r = cvs.getBoundingClientRect();
    W = r.width; H = r.height;
    cvs.width = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const GREEN = '#00ff41';
  let t = 0;

  function drawGrid() {
    ctx.strokeStyle = 'rgba(26,58,26,0.55)';
    ctx.lineWidth = 1;
    const stepX = W / 10, stepY = H / 5;
    ctx.beginPath();
    for (let i = 1; i < 10; i++) { ctx.moveTo(i * stepX, 0); ctx.lineTo(i * stepX, H); }
    for (let j = 1; j < 5; j++)  { ctx.moveTo(0, j * stepY); ctx.lineTo(W, j * stepY); }
    ctx.stroke();
    // brighter center axes
    ctx.strokeStyle = 'rgba(26,74,26,0.8)';
    ctx.beginPath();
    ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2);
    ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
    ctx.stroke();
  }

  function wave(offset, amp, alpha, width) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) {
      const k = x / W;
      // two summed sines + gentle envelope so it looks "live"
      const y = H / 2
        + Math.sin(k * Math.PI * 4 + t + offset) * amp * Math.sin(k * Math.PI)
        + Math.sin(k * Math.PI * 9 - t * 1.7 + offset) * amp * 0.28;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = width;
    ctx.shadowColor = GREEN;
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    drawGrid();
    const amp = H * 0.26;
    wave(0.25, amp, 0.15, 2);   // afterglow trail
    wave(0,    amp, 1,    2.4); // bright trace
    t += 0.05;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ── Reassurance messaging if load runs long ───────────────────────
  const stateText = document.getElementById('stateText');
  setTimeout(() => { stateText.textContent = 'Still loading'; }, 7000);
  setTimeout(() => { stateText.textContent = 'Almost there — hang tight'; }, 15000);
</script>
</body>
</html>
